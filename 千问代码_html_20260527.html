<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>扎染 · 手作温度</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      font-family: "PingFang SC", "Microsoft YaHei", sans-serif;
      background: #f5f0eb;
      color: #3a3a3a;
      min-height: 100vh;
    }

    /* 顶部横幅 */
    .hero {
      background: linear-gradient(135deg, #4a6fa5 0%, #6b5b95 40%, #c06c84 100%);
      padding: 60px 20px;
      text-align: center;
      position: relative;
      overflow: hidden;
    }

    .hero::before {
      content: "";
      position: absolute;
      top: -50%;
      left: -50%;
      width: 200%;
      height: 200%;
      background: radial-gradient(circle, rgba(255,255,255,0.1) 10%, transparent 10%),
                  radial-gradient(circle, rgba(255,255,255,0.08) 8%, transparent 8%);
      background-size: 60px 60px, 40px 40px;
      background-position: 0 0, 20px 20px;
      animation: drift 20s linear infinite;
    }

    @keyframes drift {
      0% { transform: translate(0, 0); }
      100% { transform: translate(60px, 60px); }
    }

    .hero h1 {
      font-size: 42px;
      color: #fff;
      letter-spacing: 12px;
      position: relative;
      z-index: 1;
      text-shadow: 0 2px 10px rgba(0,0,0,0.2);
    }

    .hero p {
      color: rgba(255,255,255,0.85);
      font-size: 16px;
      margin-top: 12px;
      letter-spacing: 4px;
      position: relative;
      z-index: 1;
    }

    /* 主体内容 */
    .container {
      max-width: 900px;
      margin: -40px auto 40px;
      padding: 0 20px;
      position: relative;
      z-index: 2;
    }

    /* 信息卡片 */
    .info-card {
      background: #fff;
      border-radius: 16px;
      padding: 36px 40px;
      box-shadow: 0 8px 30px rgba(0,0,0,0.08);
      margin-bottom: 30px;
    }

    .info-card h2 {
      font-size: 22px;
      color: #6b5b95;
      margin-bottom: 24px;
      padding-bottom: 12px;
      border-bottom: 2px dashed #e8e0f0;
      letter-spacing: 4px;
    }

    .info-row {
      display: flex;
      align-items: center;
      padding: 14px 0;
      border-bottom: 1px solid #f0ece6;
      font-size: 16px;
    }

    .info-row:last-child {
      border-bottom: none;
    }

    .info-label {
      width: 120px;
      color: #999;
      font-size: 15px;
      flex-shrink: 0;
    }

    .info-value {
      color: #3a3a3a;
      font-weight: 500;
      font-size: 17px;
    }

    .info-value .emoji {
      margin-right: 6px;
    }

    /* 照片区域 */
    .photo-section {
      background: #fff;
      border-radius: 16px;
      padding: 36px 40px;
      box-shadow: 0 8px 30px rgba(0,0,0,0.08);
    }

    .photo-section h2 {
      font-size: 22px;
      color: #c06c84;
      margin-bottom: 24px;
      padding-bottom: 12px;
      border-bottom: 2px dashed #f5e0e6;
      letter-spacing: 4px;
    }

    .photo-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(240px, 1fr));
      gap: 16px;
    }

    .photo-item {
      border-radius: 12px;
      overflow: hidden;
      aspect-ratio: 4 / 3;
      background: #e8e0f0;
      position: relative;
      cursor: pointer;
      transition: transform 0.3s, box-shadow 0.3s;
    }

    .photo-item:hover {
      transform: translateY(-4px);
      box-shadow: 0 10px 25px rgba(0,0,0,0.15);
    }

    .photo-item img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      display: block;
    }

    .photo-placeholder {
      width: 100%;
      height: 100%;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      background: linear-gradient(135deg, #e8e0f0, #f5e0e6);
      color: #999;
      font-size: 14px;
    }

    .photo-placeholder .icon {
      font-size: 36px;
      margin-bottom: 8px;
    }

    .photo-caption {
      position: absolute;
      bottom: 0;
      left: 0;
      right: 0;
      background: linear-gradient(transparent, rgba(0,0,0,0.6));
      color: #fff;
      padding: 20px 12px 10px;
      font-size: 13px;
      letter-spacing: 1px;
    }

    /* 底部 */
    .footer {
      text-align: center;
      padding: 30px;
      color: #bbb;
      font-size: 13px;
      letter-spacing: 2px;
    }

    /* 响应式 */
    @media (max-width: 600px) {
      .hero h1 {
        font-size: 28px;
        letter-spacing: 6px;
      }

      .info-card, .photo-section {
        padding: 24px 20px;
      }

      .info-row {
        flex-direction: column;
        align-items: flex-start;
        gap: 4px;
      }

      .info-label {
        width: auto;
      }

      .photo-grid {
        grid-template-columns: 1fr;
      }
    }
  </style>
</head>
<body>

  <!-- 顶部 -->
  <div class="hero">
    <h1>扎 染 手 作</h1>
    <p>一针一线，染出独一无二的温度</p>
  </div>

  <div class="container">

    <!-- 购买信息 -->
    <div class="info-card">
      <h2>🎁 赠礼信息</h2>
      <div class="info-row">
        <span class="info-label">购买人</span>
        <span class="info-value"><span class="emoji">🙋</span>李小雨</span>
      </div>
      <div class="info-row">
        <span class="info-label">赠送给</span>
        <span class="info-value"><span class="emoji">💝</span>妈妈 · 张秀英</span>
      </div>
      <div class="info-row">
        <span class="info-label">制作日期</span>
        <span class="info-value"><span class="emoji">📅</span>2026年5月27日</span>
      </div>
      <div class="info-row">
        <span class="info-label">作品名称</span>
        <span class="info-value"><span class="emoji">🎨</span>蓝靛花开 · 手工扎染丝巾</span>
      </div>
    </div>

    <!-- 现场照片 -->
    <div class="photo-section">
      <h2>📸 现场制作照片</h2>
      <div class="photo-grid">

        <div class="photo-item">
          <div class="photo-placeholder">
            <span class="icon">🧵</span>
            <span>扎结过程</span>
          </div>
          <div class="photo-caption">手工扎结花纹</div>
        </div>

        <div class="photo-item">
          <div class="photo-placeholder">
            <span class="icon">🪣</span>
            <span>浸染瞬间</span>
          </div>
          <div class="photo-caption">放入蓝靛染缸</div>
        </div>

        <div class="photo-item">
          <div class="photo-placeholder">
            <span class="icon">🌿</span>
            <span>氧化变色</span>
          </div>
          <div class="photo-caption">出缸氧化中</div>
        </div>

        <div class="photo-item">
          <div class="photo-placeholder">
            <span class="icon">✨</span>
            <span>拆线成品</span>
          </div>
          <div class="photo-caption">拆线后惊喜花纹</div>
        </div>

        <div class="photo-item">
          <div class="photo-placeholder">
            <span class="icon">🎀</span>
            <span>包装完成</span>
          </div>
          <div class="photo-caption">精心包装待赠</div>
        </div>

        <div class="photo-item">
          <div class="photo-placeholder">
            <span class="icon">👩‍👧</span>
            <span>赠送合影</span>
          </div>
          <div class="photo-caption">送给妈妈的那一刻</div>
        </div>

      </div>
    </div>

  </div>

  <div class="footer">
    扎染 · 让每一块布都有故事
  </div>

</body>
</html>
